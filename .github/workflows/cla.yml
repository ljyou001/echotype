# ============================================================================
# [INPUT]: 依赖 .github/cla-signatures.txt（每行一个 GitHub 数字 ID）与 PR 的提交作者（gh api，分页取全）
# [OUTPUT]: PR 的 cla 检查；有作者未签署时在 PR 下留言并失败，全部签署后删除那条留言
# [POS]: 外部贡献者 PR 的许可守门，维护者直推 main 不经过它。按不可变数字 ID 比对，与 CLA.md 对项目所有者的定义一致：
#        用户名可以改，不能当凭据。提交邮箱未关联 GitHub 账号时 API 不给作者，这类提交不参与比对
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ============================================================================
name: CLA Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get PR committers
        id: committers
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 每行 "<数字 ID> <用户名>"。该接口每页 30 条，不分页会漏掉第 31 个提交之后的作者
          COMMITTERS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select(.author != null) | "\(.author.id) \(.author.login)"' | sort -u)
          {
            echo "committers<<EOF"
            echo "$COMMITTERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check CLA signatures
        id: check
        env:
          COMMITTERS: ${{ steps.committers.outputs.committers }}
        run: |
          if [ ! -f .github/cla-signatures.txt ]; then
            echo "::error::.github/cla-signatures.txt not found"
            exit 1
          fi
          # 名单记的是数字 ID（见 CLA.md）。去掉注释、空白与 CR 后逐行精确比对
          SIGNATURES=$(grep -v '^#' .github/cla-signatures.txt | tr -d '[:blank:]\r' | grep -v '^$' || true)
          MISSING=""
          while read -r id login; do
            [ -z "$id" ] && continue
            if ! grep -qFx "$id" <<< "$SIGNATURES"; then
              # 带上数字 ID：维护者把它原样加进 cla-signatures.txt
              MISSING="${MISSING:+$MISSING, }@${login} (${id})"
            fi
          done <<< "$COMMITTERS"

          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          if [ -n "$MISSING" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR when CLA not signed
        if: steps.check.outputs.signed == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `## ❌ CLA Check Failed / CLA 检查未通过

            The following contributor(s) have not signed the **Contributor License Agreement (CLA)**:
            以下贡献者尚未签署 CLA：

            👉 **${{ steps.check.outputs.missing }}**

            ---
            
            ### How to fix? / 如何修复？
            
            1. **Read / 阅读**: [CLA.md](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            2. **Sign / 签署**: Open an Issue with title \`[CLA] I agree\` stating you accept the terms.
               (请开一个标题为 \`[CLA] I agree\` 的 Issue 声明同意条款)
            3. **Wait / 等待**: The maintainer will add you to the signature list manually.
               (维护者会手动将你加入白名单)
            
            Once added, this check will pass automatically on your next commit or re-run.
            `;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && (c.body.includes('CLA Check Failed') || c.body.includes('CLA 检查未通过')));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Remove CLA comment when signed
        if: steps.check.outputs.signed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && (c.body.includes('CLA Check Failed') || c.body.includes('CLA 检查未通过')));
            
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

      - name: Fail if CLA not signed
        if: steps.check.outputs.signed == 'false'
        run: |
          echo "::error::Contributors not signed: ${{ steps.check.outputs.missing }}"
          exit 1
