# ============================================================================
# [INPUT]: 无。用户在 Steamworks 建好 App、DLC 与 depot 后填写；同名环境变量优先
# [OUTPUT]: steam-build.sh 读取的 Steamworks ID：AppID、三个 OS depot、基础 Content depot、每个 DLC 的 depot
# [POS]: scripts/steam 唯一的配置文件，只放 Steamworks ID。每个 depot 装什么由 contracts/models.catalog.json 的
#        channels.steam.steam 决定（base_assets 与 dlc[]），steam-build 与 Core 读同一份表。
#        AppID 与 depot ID 是公开信息，可以提交。Steam 账号与密码从不写在这里
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ============================================================================

# Steamworks → App Admin 页标题旁的 App ID
STEAM_APP_ID=

# Steamworks → SteamPipe → Depots 里的 depot ID。留空 = 本次不发这个 depot。
# 填了 ID 的 depot 每次上传都必须给出内容：一次 build 必须含全部要发的 depot
STEAM_DEPOT_WINDOWS=
STEAM_DEPOT_LINUX=
STEAM_DEPOT_MACOS=

# 基础 Content depot（所有 OS）：catalog 的 base_assets。留空 = 首次使用时从 GitHub 下载
STEAM_DEPOT_CONTENT=

# DLC depot：键名 = STEAM_DEPOT_DLC_ + catalog 的 DLC id（大写，- 与 . 换成 _）。
# 不带 pack 的 DLC 一个 depot（所有 OS）；带 pack 的 DLC 每个 OS 一个 depot，键名再加 _WINDOWS / _LINUX。
# catalog 里该 DLC 的 app_id 为 null 时，填了 ID 只给警告：Core 把文件当作基础 App 的就地内容，不当作 DLC。
# app_id 已填的 DLC，它在本次所发 OS 上的 depot 必须填：否则这个 build 里没有它的内容
STEAM_DEPOT_DLC_QWEN3_ASR_0_6B=
STEAM_DEPOT_DLC_QWEN3_ASR_1_7B=
STEAM_DEPOT_DLC_WHISPER_LARGE_V3_TURBO=
STEAM_DEPOT_DLC_PARAKEET_TDT_0_6B_V3=
STEAM_DEPOT_DLC_MOONSHINE_V2_BASE_EN=
STEAM_DEPOT_DLC_CHINESE_PRO=
STEAM_DEPOT_DLC_NVIDIA_GPU_WINDOWS=
STEAM_DEPOT_DLC_NVIDIA_GPU_LINUX=
STEAM_DEPOT_DLC_VULKAN_GPU_WINDOWS=
STEAM_DEPOT_DLC_VULKAN_GPU_LINUX=
