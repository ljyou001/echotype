# ============================================================================
# [INPUT]: 无。用户在 Steamworks 建好 App 与 depot 后填写；同名环境变量优先
# [OUTPUT]: steam-build.sh 读取的 Steamworks ID 与模型 depot 内容
# [POS]: scripts/steam 唯一的配置文件。AppID 与 depot ID 是公开信息，可以提交。Steam 账号与密码从不写在这里
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
# ============================================================================

# Steamworks → App Admin 页标题旁的 App ID
STEAM_APP_ID=

# Steamworks → SteamPipe → Depots 里的 depot ID。留空 = 不发该平台。
# 填了 ID 的 depot 每次上传都必须给出内容：一次 build 必须含全部要发的 depot
STEAM_DEPOT_WINDOWS=
STEAM_DEPOT_LINUX=
STEAM_DEPOT_MACOS=

# 模型 depot（所有平台共用）。留空 = 不发模型，用户首次使用时从 GitHub 下载
STEAM_DEPOT_MODELS=

# 模型 depot 的内容：catalog 资产名，空格分隔。只接受 steam 渠道看得见的模型（steam-content.mjs 校验）。
# qwen3-asr-0.6b--gguf-q8.zip 是 steam 渠道的默认模型在 Windows / Linux / macOS 共用的资产（925 MiB）
STEAM_MODEL_ASSETS="qwen3-asr-0.6b--gguf-q8.zip"
