<!DOCTYPE html>
<html>
<head>
    <title>Test Quick Action Trigger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
        }
        .info { color: blue; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Quick Action Trigger Test</h1>
    
    <h2>Instructions:</h2>
    <ol>
        <li>Open this file in the Electron app's DevTools console</li>
        <li>Click the buttons below to test Quick Action triggering</li>
        <li>Check the console for detailed logs</li>
    </ol>

    <h2>Test Actions:</h2>
    <button onclick="testStoreState()">1. Check Store State</button>
    <button onclick="testSetModalVisible()">2. Set Modal Visible</button>
    <button onclick="testTriggerEvent()">3. Trigger IPC Event</button>
    <button onclick="testFullFlow()">4. Test Full Flow</button>

    <div id="log" class="log"></div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(message);
        }

        function testStoreState() {
            addLog('Testing store state...', 'info');
            
            // This will only work if running inside the Electron app
            if (typeof window !== 'undefined') {
                addLog('Window object available', 'success');
                
                // Check if we can access the store (this won't work in standalone HTML)
                addLog('Note: Store access only works inside the Electron app', 'info');
                addLog('Open DevTools in the app and run: useAppStore.getState()', 'info');
            }
        }

        function testSetModalVisible() {
            addLog('Attempting to set modal visible...', 'info');
            addLog('In the app DevTools, run:', 'info');
            addLog('  useAppStore.getState().setShowQuickActionModal(true)', 'info');
        }

        function testTriggerEvent() {
            addLog('Testing IPC event trigger...', 'info');
            
            if (window.echotype && window.echotype.onShowQuickAction) {
                addLog('echotype API available', 'success');
                
                // Register handler
                const cleanup = window.echotype.onShowQuickAction(() => {
                    addLog('Quick Action event received!', 'success');
                });
                
                addLog('Handler registered. Now trigger from main process.', 'info');
            } else {
                addLog('echotype API not available (not in Electron app)', 'error');
            }
        }

        function testFullFlow() {
            addLog('Testing full Quick Action flow...', 'info');
            addLog('', 'info');
            addLog('Step 1: Check if echotype API is available', 'info');
            
            if (typeof window.echotype === 'undefined') {
                addLog('❌ echotype API not found', 'error');
                addLog('This test must be run inside the Electron app', 'error');
                return;
            }
            
            addLog('✓ echotype API found', 'success');
            addLog('', 'info');
            addLog('Step 2: Check available methods', 'info');
            
            const methods = [
                'onShowQuickAction',
                'getIntegrationsConfig',
                'saveIntegrationsConfig'
            ];
            
            methods.forEach(method => {
                if (window.echotype[method]) {
                    addLog(`✓ ${method} available`, 'success');
                } else {
                    addLog(`❌ ${method} not available`, 'error');
                }
            });
            
            addLog('', 'info');
            addLog('Step 3: To manually trigger Quick Action:', 'info');
            addLog('Open DevTools Console and run:', 'info');
            addLog('  useAppStore.getState().setShowQuickActionModal(true)', 'info');
            addLog('', 'info');
            addLog('Or trigger from hotkey manager:', 'info');
            addLog('Press your hotkey with the correct timing:', 'info');
            addLog('  - Push-to-Talk mode: Quick tap (<100ms)', 'info');
            addLog('  - Toggle mode: Long press (>500ms)', 'info');
        }

        // Auto-run basic test on load
        window.addEventListener('load', () => {
            addLog('=== Quick Action Test Page Loaded ===', 'info');
            addLog('Click buttons above to run tests', 'info');
            addLog('', 'info');
            
            // Check environment
            if (typeof window.echotype !== 'undefined') {
                addLog('✓ Running inside Electron app', 'success');
                testFullFlow();
            } else {
                addLog('⚠ Not running inside Electron app', 'error');
                addLog('Open this in the app to test properly', 'info');
            }
        });
    </script>
</body>
</html>
